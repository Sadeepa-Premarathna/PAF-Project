spring.application.name=smart-campus
server.port=8080

spring.config.import=optional:file:.env

# Database
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/smart_campus_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info

# JWT
jwt.secret=${JWT_SECRET:smart-campus-jwt-secret-key-32chars!!}
jwt.access-token-expiry=${JWT_ACCESS_TOKEN_EXPIRY:900}
jwt.refresh-token-expiry=${JWT_REFRESH_TOKEN_EXPIRY:604800}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.allowed-origin=${ALLOWED_ORIGIN:http://localhost:5173}
app.upload.dir=${UPLOAD_DIR:uploads/ticket-images}

# Google OAuth
google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}

# Multipart (file upload)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
